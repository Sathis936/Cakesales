<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SweetCraft</title>
    <meta name="description" content="Create your SweetCraft account to book classes, track progress, and join our culinary community.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-top-actions">
        <button class="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
    </div>

    <section class="section" style="min-height: 100vh; padding: 2.5rem 1.5rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(210,105,30,0.08), rgba(255,107,107,0.08));">
        <div class="card auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🥐</span>
                    SweetCraft
                </a>
                <h2>Create Account</h2>
                <p>Start your pastry journey with our community.</p>
            </div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstName">First Name</label>
                        <input class="form-input" id="firstName" type="text" placeholder="First name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastName">Last Name</label>
                        <input class="form-input" id="lastName" type="text" placeholder="Last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerEmail">Email Address</label>
                    <input class="form-input" id="registerEmail" type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerPassword">Password</label>
                    <input class="form-input" id="registerPassword" type="password" placeholder="Create a password" required>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required>
                        <span>I agree to the terms</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </section>

    <script src="js/main.js?v=20260818-2"></script>
</body>
</html>
