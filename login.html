<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SweetCraft</title>
    <meta name="description" content="Login to SweetCraft and access your classes, bookings, and profile.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-top-actions">
        <button class="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
        <button class="rtl-toggle" title="Toggle RTL">RTL</button>
    </div>

    <section class="section" style="min-height: 100vh; padding: 2.5rem 1.5rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(210,105,30,0.08), rgba(255,107,107,0.08));">
        <div class="card auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🥐</span>
                    SweetCraft
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to continue your baking journey.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input class="form-input" id="loginPassword" type="password" placeholder="Enter your password" required>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </button>

                <div class="auth-divider"><span>or continue with</span></div>

                <div class="social-auth">
                    <button type="button" class="social-auth-btn"><i class="fab fa-google"></i> Google</button>
                    <button type="button" class="social-auth-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
                </div>
            </form>

            <div class="auth-footer">
                Don’t have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </section>

    <script src="js/main.js?v=20260818-2"></script>
</body>
</html>
