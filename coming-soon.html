<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - SweetCraft</title>
    <meta name="description" content="We’re preparing something special at SweetCraft. Sign up to be notified when we launch.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="coming-soon-wrapper">
        <div class="coming-soon-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">🥐</span>
                SweetCraft
            </a>
            <h1>Coming Soon</h1>
            <p>We’re preparing a new pastry experience for our community. Sign up to get early access and launch updates.</p>

            <div class="countdown">
                <div class="countdown-item">
                    <div class="countdown-number">12</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number">08</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number">24</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number">36</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <form id="comingSoonForm" class="coming-soon-form">
                <input type="email" placeholder="Enter your email address" required>
                <button type="submit">Notify Me</button>
            </form>

            <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-outline" style="border-color: rgba(255,255,255,0.4); color: white;">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
